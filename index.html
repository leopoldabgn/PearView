<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>StreetView Multi-Lieux VR</title>
  <script src="aframe.min.js"></script>
  <style>
    /* Interface 2D en haut à gauche */
    #ui-container {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-family: Arial, sans-serif;
      max-width: 300px;
    }
    .ui-panel {
      background: rgba(0, 0, 0, 0.85);
      padding: 12px 16px;
      border-radius: 12px;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .ui-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .ui-group label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
      font-weight: bold;
    }
    select, button {
      background: #222;
      color: white;
      border: 1px solid #555;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    select:hover, button:hover {
      border-color: #007bff;
    }
    .btn-primary {
      background: #007bff;
      border-color: #0056b3;
      font-weight: bold;
    }
    .btn-success {
      background: #28a745;
      border-color: #1e7e34;
      font-weight: bold;
    }
    .btn-danger {
      background: #dc3545;
      border-color: #bd2130;
      font-weight: bold;
    }
    .btn-tool {
      background: #333;
      padding: 6px 10px;
      font-size: 12px;
    }
    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-container input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    #error-msg {
      color: #ff6b6b;
      font-weight: bold;
      font-size: 13px;
    }
    /* Viseur central pour le mode édition */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 998;
      display: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: #00ffcc;
      box-shadow: 0 0 4px rgba(0,255,200,0.8);
    }
    #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
    #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

    /* Modal de liaison et d'ajustement de la flèche (Décalé à droite et semi-transparent) */
    #link-modal {
      position: absolute;
      top: 70%;
      left: 40%;
      transform: translateY(-50%);
      z-index: 1000;
      background: rgba(15, 15, 15, 0.75);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid rgba(0, 123, 255, 0.6);
      color: white;
      display: none;
      flex-direction: column;
      gap: 10px;
      min-width: 310px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      font-family: Arial, sans-serif;
    }
    
    .nudge-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <!-- Viseur vert au centre -->
  <div id="crosshair"></div>

  <!-- UI 2D -->
  <div id="ui-container">
    <div id="error-msg"></div>
    
    <div class="ui-panel" id="main-panel" style="display:none;">
      <!-- Toggle Mode Éditeur -->
      <label class="checkbox-container">
        <input type="checkbox" id="toggle-editor" onchange="toggleEditorMode(this.checked)">
        <span>🛠️ <b>Mode Éditeur</b></span>
      </label>

      <hr style="border: 0; border-top: 1px solid #444; margin: 2px 0;">

      <!-- Sélecteur de LIEU -->
      <div class="ui-group">
        <label for="select-lieu">📍 Lieu :</label>
        <select id="select-lieu" onchange="onLieuChange(this.value)"></select>
      </div>

      <!-- Sélecteur de POSITION -->
      <div class="ui-group">
        <label for="select-position">🎯 Position :</label>
        <select id="select-position" onchange="onPositionChange(this.value)"></select>
      </div>

      <!-- Sélecteur de DATE -->
      <div class="ui-group">
        <label for="select-date">📅 Date :</label>
        <select id="select-date" onchange="onDateChange(this.value)"></select>
      </div>
    </div>

    <!-- PANNEAU MODE ÉDITEUR -->
    <div class="ui-panel" id="editor-panel" style="display:none;">
      <div class="ui-group">
        <label>Outil de pose :</label>
        <button id="btn-add-arrow" class="btn-primary" onclick="spawnArrowAtCenter()">➕ Poser flèche au viseur</button>
      </div>
      <p style="font-size: 11px; color: #ccc; margin: 0;">
        1. Visez l'endroit voulu au sol.<br>
        2. Cliquez sur <b>"Poser flèche au viseur"</b>.<br>
        3. Cliquez sur une flèche pour la déplacer pas-à-pas, l'agrandir ou la relier.
      </p>

      <button class="btn-success" onclick="saveConfiguration()">💾 Sauvegarder sur le serveur</button>
    </div>
  </div>

  <!-- MODAL DE CONFIGURATION & DÉPLACEMENT PAS-À-PAS -->
  <div id="link-modal">
    <h4 style="margin:0; font-size:15px;">Configuration de la flèche</h4>
    
    <div class="ui-group">
      <label>Lieu cible :</label>
      <select id="modal-select-lieu" onchange="updateModalPositions()"></select>
    </div>
    <div class="ui-group">
      <label>Position cible :</label>
      <select id="modal-select-position"></select>
    </div>

    <!-- Section Déplacement pas-à-pas -->
    <div id="arrow-adjustment-section" style="display:none; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 8px;">
      <label style="font-size:11px; color:#aaa; font-weight:bold; text-transform:uppercase;">Ajuster la position :</label>
      
      <!-- Contrôles Avancer / Reculer / Côtés / Rotations -->
      <div class="nudge-grid">
        <button class="btn-tool" onclick="nudgeArrow('rot', 15)">⟲ Pivoter G.</button>
        <button class="btn-tool" onclick="nudgeArrow('forward', 0.5)">⬆️ Avancer</button>
        <button class="btn-tool" onclick="nudgeArrow('rot', -15)">⟳ Pivoter D.</button>
        <button class="btn-tool" onclick="nudgeArrow('strafe', 0.5)">⬅️ Gauche</button>
        <button class="btn-tool" onclick="nudgeArrow('forward', -0.5)">⬇️ Reculer</button>
        <button class="btn-tool" onclick="nudgeArrow('strafe', -0.5)">➡️ Droite</button>
      </div>

      <!-- Hauteur & Taille -->
      <div style="display:flex; gap:5px; margin-top:4px;">
        <button class="btn-tool" style="flex:1;" onclick="nudgeArrow('height', 0.2)">🔼 Monter</button>
        <button class="btn-tool" style="flex:1;" onclick="nudgeArrow('height', -0.2)">🔽 Descendre</button>
      </div>
      <div style="display:flex; gap:5px; margin-top:4px;">
        <button class="btn-tool" style="flex:1;" onclick="nudgeArrow('scale', 0.2)">🔍 + Grossir</button>
        <button class="btn-tool" style="flex:1;" onclick="nudgeArrow('scale', -0.2)">🔎 - Maigrir</button>
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-top:8px;">
      <button class="btn-primary" style="flex:1;" onclick="confirmArrowLink()">Valider</button>
      <button class="btn-danger" id="modal-btn-delete" style="display:none;" onclick="deleteSelectedArrow()">Supprimer</button>
      <button style="flex:1;" onclick="closeModal()">Fermer</button>
    </div>
  </div>

  <a-scene webxr="optionalFeatures: hit-test, local-floor">
    <a-assets>
      <img id="fleche-img" src="assets/fleche.png">
    </a-assets>

    <!-- Caméra avec curseur souris + Zoom adaptatif -->
    <a-entity id="main-camera" camera="fov: 80" look-controls="reverseMouseDrag: true" position="0 1.6 0" zoom-controls>
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .raycastable"></a-entity>
    </a-entity>

    <!-- Photo 360 en fond -->
    <a-sky id="background" src="" 
           animation__fadeout="property: components.material.material.opacity; type: opacity; from: 1; to: 0; dur: 300; startEvents: fade-out" 
           animation__fadein="property: components.material.material.opacity; type: opacity; from: 0; to: 1; dur: 300; startEvents: fade-in">
    </a-sky>

    <!-- Panneau 3D d'informations en VR -->
    <a-text id="vr-info-display" value="" position="0 2.5 -3" align="center" color="#FFFFFF" width="6" visible="false"></a-text>

    <!-- Manettes Meta Quest 3 -->
    <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .raycastable"></a-entity>
    <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .raycastable" controller-buttons></a-entity>

    <!-- Conteneur des flèches interactives -->
    <a-entity id="navigation-nodes"></a-entity>
  </a-scene>

  <script>
    // =========================================================================
    // PARAMÈTRES PERSONNALISABLES
    // =========================================================================
    const ARROW_SPAWN_DISTANCE = 6.0; // Distance en mètres où apparaît la flèche
    const ARROW_SPAWN_HEIGHT   = -1.0; // Hauteur au sol

    let APP_DATA = {};
    let currentLieuKey = "";
    let currentPosKey = "";

    let isEditorMode = false;
    let isHasUnsavedChanges = false;
    let pendingArrowData = null;
    let selectedArrowIndex = -1;

    function extractDate(filePath) {
      if (!filePath) return "";
      const fileName = filePath.split('/').pop();
      const nameWithoutExt = fileName.replace('.jpg', '').replace('.jpeg', '').replace('.png', '');
      const parts = nameWithoutExt.split('_');
      return parts[parts.length - 1];
    }

    // ==========================================
    // 1. ZOOM AVEC SENSIBILITÉ SOURIS ADAPTATIVE
    // ==========================================
    AFRAME.registerComponent('zoom-controls', {
      init: function () {
        this.minFov = 10;
        this.maxFov = 100;
        this.baseFov = 80;

        window.addEventListener('wheel', (e) => {
          let camera = this.el.getAttribute('camera');
          let currentFov = camera.fov;
          let delta = e.deltaY * 0.05;
          let newFov = Math.min(Math.max(currentFov + delta, this.minFov), this.maxFov);
          this.el.setAttribute('camera', 'fov', newFov);
        });
      }
    });

    // ==========================================
    // 2. INITIALISATION
    // ==========================================
    async function initApp() {
      try {
        const response = await fetch('config.json');
        if (!response.ok) throw new Error(`Status: ${response.status}`);
        APP_DATA = await response.json();

        const lieuxKeys = Object.keys(APP_DATA);
        if (lieuxKeys.length === 0) return;

        lieuxKeys.forEach(lieu => {
          if (APP_DATA[lieu].positions) {
            Object.keys(APP_DATA[lieu].positions).forEach(pos => {
              const posData = APP_DATA[lieu].positions[pos];
              posData.currentDateIdx = (posData.photos && posData.photos.length > 0) ? posData.photos.length - 1 : 0;
              if (!posData.arrows) posData.arrows = [];
            });
          }
        });

        document.getElementById('main-panel').style.display = 'flex';
        populateLieuDropdown();
        selectLieu(lieuxKeys[0]);

      } catch (error) {
        console.error("Erreur init :", error);
        document.getElementById('error-msg').innerText = "Erreur de chargement de config.json !";
      }
    }

    // ==========================================
    // 3. NAVIGATION
    // ==========================================
    function selectLieu(lieuKey) {
      if (!APP_DATA[lieuKey]) return;
      currentLieuKey = lieuKey;
      const lieuData = APP_DATA[lieuKey];
      currentPosKey = lieuData.defaultPosition || Object.keys(lieuData.positions)[0];

      document.getElementById('select-lieu').value = lieuKey;
      populatePositionDropdown(lieuData);
      loadPanorama(currentLieuKey, currentPosKey);
    }

    // Réinitialise la rotation de la caméra au centre (0, 0, 0)
    function resetCameraRotation() {
      const cameraEl = document.querySelector('#main-camera');
      if (cameraEl && cameraEl.components['look-controls']) {
        // Réinitialise la rotation de l'objet Three.js interne de look-controls
        cameraEl.components['look-controls'].pitchObject.rotation.x = 0;
        cameraEl.components['look-controls'].yawObject.rotation.y = 0;
      }
    }

    function loadPanorama(lieuKey, posKey, dateIndex = null) {
      const isNewPosition = (lieuKey !== currentLieuKey || posKey !== currentPosKey);

      currentLieuKey = lieuKey;
      currentPosKey = posKey;
      
      const lieuObj = APP_DATA[lieuKey];
      if (!lieuObj || !lieuObj.positions[posKey]) return;

      const posData = lieuObj.positions[posKey];
      if (dateIndex !== null) posData.currentDateIdx = dateIndex;
      if (!posData.photos || posData.photos.length === 0) return;

      const photoPath = posData.photos[posData.currentDateIdx];
      const currentDateStr = extractDate(photoPath);

      const sky = document.querySelector('#background');
      const nodesContainer = document.querySelector('#navigation-nodes');

      // 1. DÉCLENCHER LE FONDU AU NOIR (Fade Out)
      sky.emit('fade-out');
      
      // On masque instantanément les anciennes flèches pour éviter qu'elles ne sautent
      if (nodesContainer) nodesContainer.setAttribute('visible', 'false');

      // 2. ATTENDRE LA FIN DU FONDU AU NOIR (300ms) AVANT DE CHANGER LA SCÈNE
      setTimeout(() => {
        // A. Changer la photo 360
        sky.setAttribute('src', photoPath);

        // B. Recentrer la caméra dans le noir (si changement de position)
        if (isNewPosition) {
          resetCameraRotation();
        }

        // C. Générer les nouvelles flèches
        renderArrows(posData.arrows || []);
        
        // Cacher à nouveau très brièvement les flèches puis ré-afficher
        if (nodesContainer) nodesContainer.setAttribute('visible', 'true');

        // D. DÉCLENCHER LE FONDU ENTRANT (Fade In)
        sky.emit('fade-in');

      }, 300); // 300ms correspond exactement à la durée ('dur: 300') définie dans l'animation A-Frame

      // Mise à jour de l'UI
      document.getElementById('select-position').value = posKey;
      populateDateDropdown(posData);

      const vrText = document.querySelector('#vr-info-display');
      if (vrText) {
        vrText.setAttribute('value', `${lieuObj.label || lieuKey} - ${posKey} | ${currentDateStr}\n(Manette: A/B pour changer d'année)`);
      }
    }

    function renderArrows(arrowsData) {
      const nodesContainer = document.querySelector('#navigation-nodes');
      nodesContainer.innerHTML = '';

      arrowsData.forEach((arrow, idx) => {
        const el = document.createElement('a-image');
        el.setAttribute('class', 'raycastable');
        el.setAttribute('src', '#fleche-img');
        el.setAttribute('position', arrow.pos);
        el.setAttribute('rotation', arrow.rot || "-90 0 0");
        
        const scaleVal = arrow.scale || "1.5 1.5 1.5";
        el.setAttribute('scale', scaleVal);

        el.addEventListener('click', (evt) => {
          if (isEditorMode) {
            evt.stopPropagation();
            openLinkModal(idx);
          } else {
            if (arrow.targetLieu && arrow.targetLieu !== currentLieuKey) {
              selectLieu(arrow.targetLieu);
              loadPanorama(arrow.targetLieu, arrow.targetPos);
            } else {
              loadPanorama(currentLieuKey, arrow.targetPos);
            }
          }
        });

        nodesContainer.appendChild(el);
      });
    }

    // ==========================================
    // 4. MODE ÉDITEUR & POSE AU VISEUR
    // ==========================================
function toggleEditorMode(enabled) {
      if (!enabled && isHasUnsavedChanges) {
        if (!confirm("Vous avez des modifications non sauvegardées. Quitter sans sauvegarder ?")) {
          document.getElementById('toggle-editor').checked = true;
          return;
        }
      }
      isEditorMode = enabled;
      document.getElementById('editor-panel').style.display = enabled ? 'flex' : 'none';
      document.getElementById('crosshair').style.display = enabled ? 'block' : 'none';

      // Forcer le maintien du Reverse Mouse Drag sur la caméra
      const cameraEl = document.querySelector('#main-camera');
      if (cameraEl) {
        cameraEl.setAttribute('look-controls', 'reverseMouseDrag', true);
      }
    }

    function spawnArrowAtCenter() {
      const cameraEl = document.querySelector('#main-camera');
      const cameraObj = cameraEl.getObject3D('camera');
      
      let dir = new THREE.Vector3();
      cameraObj.getWorldDirection(dir);

      let angleY = Math.atan2(dir.x, dir.z) * (180 / Math.PI) + 180;

      let posX = dir.x * ARROW_SPAWN_DISTANCE;
      let posZ = dir.z * ARROW_SPAWN_DISTANCE;
      let posY = ARROW_SPAWN_HEIGHT;

      pendingArrowData = {
        pos: `${posX.toFixed(2)} ${posY.toFixed(2)} ${posZ.toFixed(2)}`,
        rot: `-90 ${angleY.toFixed(1)} 0`,
        scale: "1.5 1.5 1.5"
      };

      openLinkModal(-1);
    }

    // ==========================================
    // 5. AJUSTEMENT PAS-À-PAS DES FLÈCHES (NUDGE)
    // ==========================================
    function nudgeArrow(type, amount) {
      if (selectedArrowIndex < 0) return;
      const arrows = APP_DATA[currentLieuKey].positions[currentPosKey].arrows;
      const arrow = arrows[selectedArrowIndex];

      let posParts = arrow.pos.split(' ').map(Number);
      let rotParts = arrow.rot.split(' ').map(Number);

      let x = posParts[0], y = posParts[1], z = posParts[2];
      let rotX = rotParts[0], rotY = rotParts[1], rotZ = rotParts[2];

      if (type === 'forward') {
        let rad = (rotY - 180) * (Math.PI / 180);
        x += Math.sin(rad) * amount;
        z += Math.cos(rad) * amount;
      } else if (type === 'strafe') {
        let rad = (rotY - 90) * (Math.PI / 180);
        x += Math.sin(rad) * amount;
        z += Math.cos(rad) * amount;
      } else if (type === 'height') {
        y += amount;
      } else if (type === 'rot') {
        rotY = (rotY + amount) % 360;
      } else if (type === 'scale') {
        let currentScale = 1.5;
        if (arrow.scale) {
          currentScale = parseFloat(arrow.scale.split(' ')[0]);
        }
        currentScale = Math.max(0.3, Math.min(5.0, currentScale + amount));
        arrow.scale = `${currentScale.toFixed(2)} ${currentScale.toFixed(2)} ${currentScale.toFixed(2)}`;
      }

      arrow.pos = `${x.toFixed(2)} ${y.toFixed(2)} ${z.toFixed(2)}`;
      arrow.rot = `${rotX} ${rotY.toFixed(1)} ${rotZ}`;

      isHasUnsavedChanges = true;
      renderArrows(arrows);
    }

    // ==========================================
    // 6. MODAL DE GESTION
    // ==========================================
    function openLinkModal(arrowIdx) {
      selectedArrowIndex = arrowIdx;
      const modal = document.getElementById('link-modal');
      const deleteBtn = document.getElementById('modal-btn-delete');
      const adjustSection = document.getElementById('arrow-adjustment-section');
      modal.style.display = 'flex';

      populateModalLieux();

      if (arrowIdx >= 0) {
        deleteBtn.style.display = 'block';
        adjustSection.style.display = 'block';
        let arrow = APP_DATA[currentLieuKey].positions[currentPosKey].arrows[arrowIdx];
        document.getElementById('modal-select-lieu').value = arrow.targetLieu || currentLieuKey;
        updateModalPositions();
        document.getElementById('modal-select-position').value = arrow.targetPos;
      } else {
        deleteBtn.style.display = 'none';
        adjustSection.style.display = 'none';
        document.getElementById('modal-select-lieu').value = currentLieuKey;
        updateModalPositions();
      }
    }

    function populateModalLieux() {
      const select = document.getElementById('modal-select-lieu');
      select.innerHTML = '';
      Object.keys(APP_DATA).forEach(lieuKey => {
        const opt = document.createElement('option');
        opt.value = lieuKey;
        opt.innerText = APP_DATA[lieuKey].label || lieuKey;
        select.appendChild(opt);
      });
    }

    function updateModalPositions() {
      const targetLieu = document.getElementById('modal-select-lieu').value;
      const select = document.getElementById('modal-select-position');
      select.innerHTML = '';
      
      if (APP_DATA[targetLieu] && APP_DATA[targetLieu].positions) {
        Object.keys(APP_DATA[targetLieu].positions).forEach(posKey => {
          const opt = document.createElement('option');
          opt.value = posKey;
          opt.innerText = posKey;
          select.appendChild(opt);
        });
      }
    }

    function confirmArrowLink() {
      const targetLieu = document.getElementById('modal-select-lieu').value;
      const targetPos = document.getElementById('modal-select-position').value;
      const arrows = APP_DATA[currentLieuKey].positions[currentPosKey].arrows;

      if (selectedArrowIndex >= 0) {
        arrows[selectedArrowIndex].targetLieu = targetLieu;
        arrows[selectedArrowIndex].targetPos = targetPos;
      } else if (pendingArrowData) {
        arrows.push({
          targetLieu: targetLieu,
          targetPos: targetPos,
          pos: pendingArrowData.pos,
          rot: pendingArrowData.rot,
          scale: pendingArrowData.scale || "1.5 1.5 1.5"
        });
      }

      isHasUnsavedChanges = true;
      closeModal();
      renderArrows(arrows);
    }

    function deleteSelectedArrow() {
      if (selectedArrowIndex >= 0) {
        APP_DATA[currentLieuKey].positions[currentPosKey].arrows.splice(selectedArrowIndex, 1);
        isHasUnsavedChanges = true;
        renderArrows(APP_DATA[currentLieuKey].positions[currentPosKey].arrows);
      }
      closeModal();
    }

    function closeModal() {
      document.getElementById('link-modal').style.display = 'none';
      selectedArrowIndex = -1;
      pendingArrowData = null;
    }

    // ==========================================
    // 7. SAUVEGARDE DIRECTE SUR LE BACKEND
    // ==========================================
    async function saveConfiguration() {
      let dataToExport = JSON.parse(JSON.stringify(APP_DATA));
      Object.keys(dataToExport).forEach(lieu => {
        Object.keys(dataToExport[lieu].positions).forEach(pos => {
          delete dataToExport[lieu].positions[pos].currentDateIdx;
        });
      });

      try {
        const response = await fetch('/api/save-config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataToExport, null, 2)
        });

        if (response.ok) {
          isHasUnsavedChanges = false;
          alert("✅ Sauvegarde réussie avec création de backup dans /backup !");
          return;
        }
      } catch (err) {
        console.warn("Erreur d'enregistrement serveur, mode téléchargement fallback...");
      }

      // Fallback
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "config.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      isHasUnsavedChanges = false;
    }

    // ==========================================
    // 8. DROPDOWNS & MANETTES VR
    // ==========================================
    function populateLieuDropdown() {
      const select = document.getElementById('select-lieu');
      select.innerHTML = '';
      Object.keys(APP_DATA).forEach(lieuKey => {
        const opt = document.createElement('option');
        opt.value = lieuKey;
        opt.innerText = APP_DATA[lieuKey].label || lieuKey;
        select.appendChild(opt);
      });
    }

    function populatePositionDropdown(lieuData) {
      const select = document.getElementById('select-position');
      select.innerHTML = '';
      if (!lieuData || !lieuData.positions) return;

      Object.keys(lieuData.positions).forEach(posKey => {
        const opt = document.createElement('option');
        opt.value = posKey;
        opt.innerText = posKey;
        select.appendChild(opt);
      });
      select.value = currentPosKey;
    }

    function populateDateDropdown(posData) {
      const select = document.getElementById('select-date');
      select.innerHTML = '';
      if (!posData || !posData.photos) return;

      posData.photos.forEach((photoPath, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = extractDate(photoPath);
        select.appendChild(opt);
      });
      select.value = posData.currentDateIdx;
    }

    function onLieuChange(lieuKey) { selectLieu(lieuKey); }
    function onPositionChange(posKey) { loadPanorama(currentLieuKey, posKey); }
    function onDateChange(dateIdx) { loadPanorama(currentLieuKey, currentPosKey, parseInt(dateIdx, 10)); }

    function cycleDate(direction) {
      const posData = APP_DATA[currentLieuKey].positions[currentPosKey];
      if (!posData || !posData.photos) return;

      let newIdx = posData.currentDateIdx + direction;
      if (newIdx >= posData.photos.length) newIdx = 0;
      if (newIdx < 0) newIdx = posData.photos.length - 1;

      loadPanorama(currentLieuKey, currentPosKey, newIdx);
    }

    AFRAME.registerComponent('controller-buttons', {
      init: function () {
        this.el.addEventListener('abuttondown', () => cycleDate(1));
        this.el.addEventListener('bbuttondown', () => cycleDate(-1));
      }
    });

    document.querySelector('a-scene').addEventListener('enter-vr', () => {
      document.querySelector('#vr-info-display').setAttribute('visible', 'true');
    });
    document.querySelector('a-scene').addEventListener('exit-vr', () => {
      document.querySelector('#vr-info-display').setAttribute('visible', 'false');
    });

    window.onload = initApp;
  </script>
</body>
</html>
